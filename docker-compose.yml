services:
  gameatlas:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: gameatlas-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # No ports needed — bot uses outbound connections only
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
